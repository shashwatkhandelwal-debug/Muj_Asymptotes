<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERITAS // Edge Challenge Capture Client</title>

  <!-- Typography with offline-safe system fallback stacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- MediaPipe Face Detection CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    :root {
      /* Canvas — matte obsidian, tonally layered */
      --bg-void:         #070a0e;   /* page background */
      --bg-panel:        #0c1017;   /* card surface */
      --bg-panel-raised: #121620;   /* hover / nested surface */
      --bg-inset:        #060810;   /* recessed areas */

      /* Borders */
      --border-hairline: rgba(255,255,255,0.07);
      --border-strong:   rgba(255,255,255,0.16);

      /* Text */
      --text-primary:    #e8eaee;
      --text-secondary:  #9aa0ac;
      --text-tertiary:   #5b6270;

      /* Neutral tech accent */
      --accent-blue:     #38bdf8;
      --accent-teal:     #2dd4bf;
      --accent-dim:      rgba(56,189,248,0.12);

      /* Semantic */
      --clear:           #10b981;
      --clear-dim:       rgba(16,185,129,0.12);
      --review:          #f59e0b;
      --review-dim:      rgba(245,158,11,0.12);
      --flagged:         #ef4444;
      --flagged-dim:     rgba(239,68,68,0.14);

      /* Fonts */
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(ellipse 900px 500px at 12% -8%, rgba(56,189,248,0.06), transparent 60%),
        var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .mono {
      font-family: var(--font-mono);
      font-feature-settings: "tnum" 1;
      font-variant-numeric: tabular-nums;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Top navigation header */
    header {
      height: 56px;
      background: var(--bg-void);
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    /* Ghost link per §5.9 */
    .link-ghost {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 140ms ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .link-ghost:hover {
      color: var(--text-primary);
    }

    /* Terminal Key Button */
    .btn-terminal {
      background: var(--bg-panel);
      border: 1px solid var(--border-hairline);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 140ms ease, color 140ms ease, background 140ms ease;
      text-decoration: none;
    }
    .btn-terminal:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
      background: var(--bg-panel-raised);
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-hairline);
      border-radius: 8px;
      padding: 24px 28px;
      position: relative;
      transition: border-color 160ms ease;
    }
    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12px;
      right: 12px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      pointer-events: none;
    }

    /* Recessed inline mono block */
    .recessed-block {
      background: var(--bg-inset);
      padding: 10px 14px;
      border-radius: 4px;
      border: 1px solid var(--border-hairline);
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--accent-blue);
      word-break: break-all;
    }

    /* Recording dot pulse */
    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--flagged);
      animation: recPulse 1.2s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes recPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    /* CSS-only processing spinner */
    .spinner {
      width: 36px;
      height: 36px;
      border: 2px solid var(--border-hairline);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 700ms linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    main {
      flex-grow: 1;
      display: flex;
      background: var(--border-subtle);
    }

    .step-dot.active { background: var(--accent-blue); }
    .step-dot.done   { background: var(--clear); }

    /* Landmark overlay canvas */
    canvas#mesh-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: scaleX(-1);
    }

    footer {
      width: 100%;
      border-top: 1px solid var(--border-hairline);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-tertiary);
      background: var(--bg-surface);
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span class="mono" style="font-size: 13px; font-weight: 700; color: var(--text-primary);">VERITAS</span>
      <span style="color: var(--border-strong);">|</span>
      <span class="mono" style="font-size: 12px; color: var(--text-tertiary);">EDGE CHALLENGE CLIENT</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="mono" style="font-size: 11px; padding: 4px 10px; border-radius: 12px; background: var(--clear-dim); color: var(--clear);">✓ Step 1: Document</span>
      <span class="mono" style="font-size: 11px; color: var(--text-tertiary);">→</span>
      <span class="mono" style="font-size: 11px; padding: 4px 10px; border-radius: 12px; background: var(--accent-dim); color: var(--accent-blue); border: 1px solid rgba(56,189,248,0.3);">Step 2 of 3: Biometrics</span>
      <span class="mono" style="font-size: 11px; color: var(--text-tertiary);">→</span>
      <span class="mono" style="font-size: 11px; padding: 4px 10px; border-radius: 12px; background: var(--bg-panel); color: var(--text-tertiary); border: 1px solid var(--border-hairline);">Step 3: Audit</span>
    </div>
  </header>

  <main>
    <div id="capture-root">
      <!-- Mounted by app.js -->
    </div>
  </main>

  <footer>
    <span>VERITAS DEFENSE PIPELINE // TIER-3 VERIFICATION</span>
    <span>ON-DEVICE EDGE CAPTURE</span>
  </footer>

  <!-- Capture logic module -->
  <script type="module" src="app.js"></script>
</body>
</html>
